<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b35">
<meta name="description" content="Thai Glass Inventory — stock, purchases, sales and invoices">
<link rel="manifest" href="manifest.json">
<title>Inventory Manager</title>
<style>
:root{--bg:#f3f6f5;--panel:#fff;--ink:#172b27;--muted:#6b7c77;--brand:#155e52;--brand2:#d9eee8;--line:#e1e9e6;--red:#b42318;--amber:#986500;--shadow:0 8px 24px #143a3010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
header{background:linear-gradient(120deg,#123b35,#19715f);color:white;padding:18px max(16px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:22px}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;font-size:12px;color:#d1e8e2}.header-actions{display:flex;gap:8px;align-items:center}.header-actions select,.header-actions button{border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:10px;padding:8px 10px}.header-actions option{color:#172b27}
.layout{max-width:1180px;margin:auto;padding:18px 16px 40px;display:grid;grid-template-columns:220px 1fr;gap:18px}.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;height:max-content;box-shadow:var(--shadow);position:sticky;top:12px}.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;color:var(--ink);margin:2px 0}.nav.active{background:var(--brand2);color:var(--brand);font-weight:700}.nav .ico{width:22px;text-align:center}.content{min-width:0}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}.page-title h2{margin:0;font-size:24px}.page-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;background:var(--brand);color:white;padding:10px 14px;font-weight:650}.btn.secondary{background:#e9f2ef;color:var(--brand)}.btn.danger{background:#fff0ef;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:23px;font-weight:750;margin-top:8px;overflow-wrap:anywhere}.stat .hint{font-size:11px;color:var(--muted);margin-top:5px}.panel{margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.panel-head h3{margin:0;font-size:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{flex:1;min-width:140px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.toolbar input,.toolbar select{border:1px solid #d5e1dc;border-radius:10px;padding:11px;background:#fff;color:var(--ink);min-width:0;width:100%}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);font-weight:700;background:#f8faf9}td .sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e7f6ee;color:#21734b;font-size:11px}.pill.low{background:#fff4d6;color:var(--amber)}.empty{text-align:center;color:var(--muted);padding:30px 10px}.hidden{display:none!important}.notice{background:#fff8e6;border:1px solid #f0dfa7;color:#765a10;padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.5;margin-bottom:14px}.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:#d8eee7}.dot{width:7px;height:7px;background:#f4d36c;border-radius:50%}.mobile-nav{display:none}.modal-backdrop{position:fixed;inset:0;background:#10221fc0;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#fff;border-radius:18px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h3{margin:0 0 16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#153d35;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:20;font-size:13px;max-width:90vw}
@media(max-width:820px){.layout{display:block;padding:14px 12px 90px}.sidebar{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat .value{font-size:20px}.page-title h2{font-size:21px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}.mobile-nav button.active{color:var(--brand);font-weight:700}.mobile-nav .ico{font-size:18px}.form-grid{grid-template-columns:1fr}.header-actions .sync{display:none}header{padding:14px 12px}.brand h1{font-size:16px}.header-actions select,.header-actions button{padding:7px 8px}.toolbar input,.toolbar select{min-width:100%}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="logo">▦</div><div><h1 id="appName">Inventory Manager</h1><p id="tagline">Stock • Sales • Purchases</p></div></div>
 <div class="header-actions"><span class="sync"><span class="dot"></span><span id="syncLabel">Offline demo</span></span><select id="langSelect" aria-label="Language"><option value="bn">বাংলা</option><option value="en">English</option></select><button id="settingsBtn">⚙</button></div>
</header>
<div class="layout">
 <aside class="sidebar" id="sideNav"></aside>
 <main class="content">
  <div class="notice" id="demoNotice">এটি প্রথম সংস্করণের লোকাল প্রোটোটাইপ। এই ডিভাইসে ডেটা রাখা হয়। অনলাইন লগইন ও একাধিক ডিভাইসের সিঙ্ক চালু করতে Supabase কনফিগার করতে হবে।</div>
  <div id="page"></div>
 </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);
const translations={
 bn:{dashboard:"ড্যাশবোর্ড",products:"পণ্য ও স্টক",movements:"স্টক লেনদেন",sales:"বিক্রি / ইনভয়েস",purchases:"কেনাকাটা",settings:"সেটিংস",totalProducts:"মোট পণ্য",stockValue:"স্টকের মূল্য",lowStock:"কম স্টক",salesToday:"আজকের বিক্রি",quickActions:"দ্রুত কাজ",addProduct:"নতুন পণ্য",stockIn:"স্টক যোগ",stockOut:"স্টক বের",newSale:"নতুন বিক্রি",recent:"সাম্প্রতিক স্টক লেনদেন",search:"পণ্য খুঁজুন…",name:"পণ্যের নাম",code:"পণ্য কোড (ঐচ্ছিক)",category:"ক্যাটাগরি",unit:"ইউনিট",length:"দৈর্ঘ্য (ফুট)",buyPrice:"ক্রয়মূল্য (৳)",sellPrice:"বিক্রয়মূল্য (৳)",quantity:"পরিমাণ",save:"সংরক্ষণ",cancel:"বাতিল",actions:"কাজ",product:"পণ্য",stock:"স্টক",price:"বিক্রয়মূল্য",edit:"সম্পাদনা",noProducts:"এখনো কোনো পণ্য নেই। নতুন পণ্য যোগ করুন।",noMoves:"এখনো কোনো স্টক লেনদেন নেই।",addStockTitle:"স্টক যোগ / বের",type:"লেনদেনের ধরন",in:"স্টক যোগ",out:"স্টক বের",note:"নোট (ঐচ্ছিক)",record:"লেনদেন সংরক্ষণ",salesTitle:"বিক্রি / ইনভয়েস",customer:"ক্রেতার নাম (ঐচ্ছিক)",chooseProduct:"পণ্য নির্বাচন",qty:"পরিমাণ",unitPrice:"প্রতি ইউনিট দাম (৳)",createInvoice:"ইনভয়েস তৈরি",invoiceHistory:"এই ডিভাইসের বিক্রির ইতিহাস",total:"মোট",noSales:"এখনো কোনো বিক্রি নেই।",language:"ভাষা",currency:"মুদ্রা",bdt:"বাংলাদেশি টাকা (BDT)",settingsText:"পণ্যের তালিকা ও স্টক এই ডিভাইসে সংরক্ষিত থাকে।",saveSettings:"সেটিংস সংরক্ষণ",dashboardSub:"দোকানের স্টক ও বিক্রির সারাংশ",productSub:"পণ্য যোগ করুন এবং বর্তমান স্টক দেখুন",movesSub:"স্টক বাড়ানো বা কমানোর ইতিহাস",salesSub:"বিক্রি রেকর্ড করুন এবং ইনভয়েস দেখুন",purchasesSub:"মাল কেনার রেকর্ড Stock In থেকে যোগ করুন",purchasesText:"এই প্রোটোটাইপে কেনাকাটা Stock In লেনদেনের মাধ্যমে রেকর্ড হয়। পূর্ণ সংস্করণে সরবরাহকারী ও Purchase Invoice যুক্ত হবে।",low:"কম",normal:"স্বাভাবিক",date:"তারিখ",kind:"ধরন",noteLabel:"নোট",empty:"কোনো তথ্য নেই",invoice:"ইনভয়েস",print:"প্রিন্ট / PDF",close:"বন্ধ",successProduct:"পণ্য সংরক্ষণ হয়েছে",successMove:"স্টক লেনদেন সংরক্ষণ হয়েছে",successSale:"বিক্রি সংরক্ষণ হয়েছে",required:"পণ্যের নাম ও পরিমাণ দিন",notEnough:"স্টক পর্যাপ্ত নয়",settingsTitle:"অ্যাপ সেটিংস",appTitle:"অ্যাপের নাম",saveName:"নাম সংরক্ষণ",ownerNote:"এটি এখনো স্থানীয় ডেমো; কর্মচারীর আলাদা লগইন সক্রিয় নয়।",all:"সব"},
 en:{dashboard:"Dashboard",products:"Products & Stock",movements:"Stock Movements",sales:"Sales / Invoices",purchases:"Purchases",settings:"Settings",totalProducts:"Total products",stockValue:"Stock value",lowStock:"Low stock",salesToday:"Sales today",quickActions:"Quick actions",addProduct:"Add product",stockIn:"Stock in",stockOut:"Stock out",newSale:"New sale",recent:"Recent stock movements",search:"Search products…",name:"Product name",code:"Product code (optional)",category:"Category",unit:"Unit",length:"Length (ft)",buyPrice:"Purchase price (৳)",sellPrice:"Selling price (৳)",quantity:"Quantity",save:"Save",cancel:"Cancel",actions:"Actions",product:"Product",stock:"Stock",price:"Selling price",edit:"Edit",noProducts:"No products yet. Add your first product.",noMoves:"No stock movements yet.",addStockTitle:"Stock in / out",type:"Movement type",in:"Stock in",out:"Stock out",note:"Note (optional)",record:"Save movement",salesTitle:"Sales / invoices",customer:"Customer name (optional)",chooseProduct:"Choose product",qty:"Quantity",unitPrice:"Unit price (৳)",createInvoice:"Create invoice",invoiceHistory:"Sales history on this device",total:"Total",noSales:"No sales yet.",language:"Language",currency:"Currency",bdt:"Bangladeshi Taka (BDT)",settingsText:"Products and stock are saved on this device.",saveSettings:"Save settings",dashboardSub:"Overview of shop stock and sales",productSub:"Add products and review current stock",movesSub:"History of stock increases and decreases",salesSub:"Record a sale and view invoices",purchasesSub:"Record received goods through Stock In",purchasesText:"In this prototype, purchases are recorded as Stock In movements. Supplier and purchase invoices will be added in the full version.",low:"Low",normal:"Normal",date:"Date",kind:"Type",noteLabel:"Note",empty:"No data",invoice:"Invoice",print:"Print / PDF",close:"Close",successProduct:"Product saved",successMove:"Stock movement saved",successSale:"Sale saved",required:"Enter product name and quantity",notEnough:"Insufficient stock",settingsTitle:"App settings",appTitle:"App name",saveName:"Save name",ownerNote:"This is still a local demo; separate employee logins are not enabled.",all:"All"}
};
let lang=localStorage.getItem("tg_lang")||"bn", currentPage="dashboard";
let data=JSON.parse(localStorage.getItem("tg_inventory")||'{"products":[],"movements":[],"sales":[],"settings":{"appName":"Inventory Manager"}}');
const t=k=>translations[lang][k]||k, money=n=>new Intl.NumberFormat(lang==="bn"?"bn-BD":"en-BD",{style:"currency",currency:"BDT",maximumFractionDigits:2}).format(Number(n)||0), dateFmt=d=>new Date(d).toLocaleString(lang==="bn"?"bn-BD":"en-BD");
function persist(){localStorage.setItem("tg_inventory",JSON.stringify(data));}
function toast(s){$("#toastRoot").innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$("#toastRoot").innerHTML="",2400)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const navItems=[["dashboard","⌂"],["products","▦"],["movements","↕"],["sales","▤"],["purchases","🛒"],["settings","⚙"]];
function nav(){const html=navItems.map(([k,i])=>`<button class="nav ${currentPage===k?"active":""}" data-page="${k}"><span class="ico">${i}</span><span>${t(k)}</span></button>`).join("");$("#sideNav").innerHTML=html;$("#mobileNav").innerHTML=navItems.filter(([k])=>k!=="purchases"&&k!=="settings").map(([k,i])=>`<button class="${currentPage===k?"active":""}" data-page="${k}"><span class="ico">${i}</span>${t(k)}</button>`).join("")+`<button data-page="settings" class="${currentPage==="settings"?"active":""}"><span class="ico">⚙</span>${t("settings")}</button>`;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;render()})}
function title(k,sub,action=""){return `<div class="page-title"><div><h2>${t(k)}</h2><p>${t(sub)}</p></div>${action}</div>`}
function stat(k,v,hint=""){return `<div class="stat"><div class="label">${t(k)}</div><div class="value">${v}</div><div class="hint">${hint}</div></div>`}
function productRows(list){if(!list.length)return `<tr><td colspan="6" class="empty">${t("noProducts")}</td></tr>`;return list.map(p=>`<tr><td><strong>${esc(p.name)}</strong><span class="sub">${esc(p.code||p.category||"")}</span></td><td>${esc(p.category||"—")}</td><td>${esc(p.length?`${p.length} ft`:"—")}<span class="sub">${esc(p.unit)}</span></td><td><span class="pill ${p.qty<=Number(p.low||0)?"low":""}">${p.qty}</span></td><td>${money(p.sellPrice)}</td><td><button class="btn secondary" data-edit="${p.id}">${t("edit")}</button></td></tr>`).join("")}
function renderDashboard(){let totalValue=data.products.reduce((s,p)=>s+p.qty*p.buyPrice,0), low=data.products.filter(p=>p.qty<=Number(p.low||0)).length, today=new Date().toDateString(), salesToday=data.sales.filter(s=>new Date(s.date).toDateString()===today).reduce((s,x)=>s+x.total,0);
return title("dashboard","dashboardSub",`<button class="btn" id="dashAdd">＋ ${t("addProduct")}</button>`)+`<div class="stats">${stat("totalProducts",data.products.length,t("all"))}${stat("stockValue",money(totalValue),t("bdt"))}${stat("lowStock",low,t("low"))}${stat("salesToday",money(salesToday),t("bdt"))}</div><section class="panel"><div class="panel-head"><h3>${t("quickActions")}</h3></div><div class="toolbar"><button class="btn" id="quickProduct">＋ ${t("addProduct")}</button><button class="btn secondary" id="quickIn">＋ ${t("stockIn")}</button><button class="btn secondary" id="quickOut">− ${t("stockOut")}</button><button class="btn secondary" id="quickSale">▤ ${t("newSale")}</button></div></section><section class="panel"><div class="panel-head"><h3>${t("recent")}</h3><button class="btn secondary" data-page="movements">${t("all")}</button></div>${movementTable(data.movements.slice(-5).reverse())}</section>`}
function renderProducts(){return title("products","productSub",`<button class="btn" id="addProductBtn">＋ ${t("addProduct")}</button>`)+`<section class="panel"><div class="toolbar"><input id="productSearch" placeholder="${t("search")}"><select id="catFilter"><option value="">${t("all")} ${t("category")}</option>${[...new Set(data.products.map(p=>p.category).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div class="table-wrap"><table><thead><tr><th>${t("product")}</th><th>${t("category")}</th><th>${t("length")} / ${t("unit")}</th><th>${t("stock")}</th><th>${t("price")}</th><th>${t("actions")}</th></tr></thead><tbody id="productBody">${productRows(data.products)}</tbody></table></div></section>`}
function movementTable(list){return `<div class="table-wrap"><table><thead><tr><th>${t("date")}</th><th>${t("product")}</th><th>${t("kind")}</th><th>${t("quantity")}</th><th>${t("noteLabel")}</th></tr></thead><tbody>${list.length?list.map(m=>{let p=data.products.find(x=>x.id===m.productId);return `<tr><td>${esc(dateFmt(m.date))}</td><td>${esc(p?.name||m.productName||"—")}</td><td><span class="pill ${m.type==="out"?"low":""}">${t(m.type)}</span></td><td>${m.type==="out"?"−":"+"}${m.qty}</td><td>${esc(m.note||"—")}</td></tr>`}).join(""):`<tr><td colspan="5" class="empty">${t("noMoves")}</td></tr>`}</tbody></table></div>`}
function renderMovements(){return title("movements","movesSub",`<button class="btn" id="addMoveBtn">＋ ${t("record")}</button>`)+`<section class="panel">${movementTable(data.movements.slice().reverse())}</section>`}
function renderSales(){return title("sales","salesSub",`<button class="btn" id="newSaleBtn">＋ ${t("newSale")}</button>`)+`<section class="panel"><div class="panel-head"><h3>${t("invoiceHistory")}</h3></div><div class="table-wrap"><table><thead><tr><th>${t("invoice")}</th><th>${t("date")}</th><th>${t("customer")}</th><th>${t("total")}</th><th>${t("actions")}</th></tr></thead><tbody>${data.sales.length?data.sales.slice().reverse().map(s=>`<tr><td>${esc(s.invoice)}</td><td>${esc(dateFmt(s.date))}</td><td>${esc(s.customer||"—")}</td><td>${money(s.total)}</td><td><button class="btn secondary" data-invoice="${s.id}">${t("print")}</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">${t("noSales")}</td></tr>`}</tbody></table></div></section>`}
function renderPurchases(){return title("purchases","purchasesSub")+`<section class="panel"><p>${t("purchasesText")}</p><button class="btn" id="purchaseInBtn">＋ ${t("stockIn")}</button></section>`}
function renderSettings(){return title("settings","settingsText")+`<section class="panel"><h3>${t("settingsTitle")}</h3><div class="form-grid"><div class="field"><label>${t("appTitle")}</label><input id="appNameInput" value="${esc(data.settings.appName||"Inventory Manager")}"></div><div class="field"><label>${t("language")}</label><select id="settingsLang"><option value="bn" ${lang==="bn"?"selected":""}>বাংলা</option><option value="en" ${lang==="en"?"selected":""}>English</option></select></div><div class="field"><label>${t("currency")}</label><input value="${t("bdt")}" disabled></div></div><div class="form-actions"><button class="btn" id="saveSettings">${t("saveSettings")}</button></div></section><section class="panel"><h3>Cloud & Account</h3><p>${t("ownerNote")}</p><p class="sub">Production setup needs a Supabase project, authentication, database policies, and tested conflict-safe sync.</p></section><section class="panel"><button class="btn danger" id="exportBtn">Export JSON backup</button> <button class="btn secondary" id="importBtn">Import JSON backup</button><input type="file" id="importFile" accept="application/json" class="hidden"></section>`}
function render(){nav();$("#appName").textContent=data.settings.appName||"Inventory Manager";$("#tagline").textContent=lang==="bn"?"স্টক • বিক্রি • কেনাকাটা":"Stock • Sales • Purchases";$("#langSelect").value=lang;$("#demoNotice").textContent=lang==="bn"?"এটি প্রথম সংস্করণের লোকাল প্রোটোটাইপ। এই ডিভাইসে ডেটা রাখা হয়। অনলাইন লগইন ও একাধিক ডিভাইসের সিঙ্ক চালু করতে Supabase কনফিগার করতে হবে।":"This is a local prototype. Data is stored on this device. Supabase setup is required for online login and multi-device sync.";let html=currentPage==="dashboard"?renderDashboard():currentPage==="products"?renderProducts():currentPage==="movements"?renderMovements():currentPage==="sales"?renderSales():currentPage==="purchases"?renderPurchases():renderSettings();$("#page").innerHTML=html;wirePage()}
function openModal(content){$("#modalRoot").innerHTML=`<div class="modal-backdrop"><div class="modal">${content}</div></div>`;$("#modalRoot").querySelector(".modal-backdrop").onclick=e=>{if(e.target.classList.contains("modal-backdrop"))closeModal()};$("#modalRoot").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal)}
function closeModal(){$("#modalRoot").innerHTML=""}
function productModal(p=null){let x=p||{name:"",code:"",category:"Aluminium",unit:"pcs",length:"",buyPrice:"",sellPrice:"",qty:0,low:0};openModal(`<h3>${p?t("edit"):t("addProduct")}</h3><form id="productForm"><div class="form-grid"><div class="field"><label>${t("name")} *</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>${t("code")}</label><input name="code" value="${esc(x.code)}"></div><div class="field"><label>${t("category")}</label><input name="category" list="categories" value="${esc(x.category)}"><datalist id="categories"><option>Aluminium</option><option>Glass</option><option>Rubber</option><option>Wheel</option><option>Lock</option><option>Other</option></datalist></div><div class="field"><label>${t("unit")}</label><select name="unit">${["pcs","ft","sq ft","meter","kg","set","box"].map(u=>`<option ${x.unit===u?"selected":""}>${u}</option>`).join("")}</select></div><div class="field"><label>${t("length")}</label><input name="length" type="number" min="0" step=".01" value="${esc(x.length)}" placeholder="e.g. 21"></div><div class="field"><label>${t("quantity")}</label><input name="qty" type="number" min="0" step=".01" value="${p?x.qty:0}" ${p?"disabled":""}></div><div class="field"><label>${t("buyPrice")}</label><input name="buyPrice" type="number" min="0" step=".01" value="${esc(x.buyPrice)}"></div><div class="field"><label>${t("sellPrice")}</label><input name="sellPrice" type="number" min="0" step=".01" value="${esc(x.sellPrice)}"></div><div class="field"><label>Low stock alert</label><input name="low" type="number" min="0" step=".01" value="${esc(x.low)}"></div></div><div class="form-actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn">${t("save")}</button></div></form>`);$("#productForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:p?.id||crypto.randomUUID(),name:f.get("name").trim(),code:f.get("code").trim(),category:f.get("category").trim(),unit:f.get("unit"),length:Number(f.get("length"))||0,buyPrice:Number(f.get("buyPrice"))||0,sellPrice:Number(f.get("sellPrice"))||0,qty:p?p.qty:Number(f.get("qty"))||0,low:Number(f.get("low"))||0};if(!obj.name){toast(t("required"));return}if(p){data.products=data.products.map(z=>z.id===p.id?obj:z)}else{data.products.push(obj);if(obj.qty>0)data.movements.push({id:crypto.randomUUID(),productId:obj.id,productName:obj.name,type:"in",qty:obj.qty,note:"Opening stock",date:new Date().toISOString()})}persist();closeModal();render();toast(t("successProduct"))}}
function moveModal(type="in"){if(!data.products.length){toast(t("noProducts"));productModal();return}openModal(`<h3>${t("addStockTitle")}</h3><form id="moveForm"><div class="form-grid"><div class="field"><label>${t("type")}</label><select name="type"><option value="in" ${type==="in"?"selected":""}>${t("in")}</option><option value="out" ${type==="out"?"selected":""}>${t("out")}</option></select></div><div class="field"><label>${t("product")}</label><select name="productId" required>${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.qty} ${esc(p.unit)}</option>`).join("")}</select></div><div class="field"><label>${t("quantity")} *</label><input name="qty" type="number" min=".01" step=".01" required></div><div class="field"><label>${t("note")}</label><input name="note"></div></div><div class="form-actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn">${t("record")}</button></div></form>`);$("#moveForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=data.products.find(z=>z.id===f.get("productId")),q=Number(f.get("qty")),ty=f.get("type");if(!p||q<=0)return;if(ty==="out"&&q>p.qty){toast(t("notEnough"));return}p.qty+=ty==="in"?q:-q;data.movements.push({id:crypto.randomUUID(),productId:p.id,productName:p.name,type:ty,qty:q,note:f.get("note"),date:new Date().toISOString()});persist();closeModal();render();toast(t("successMove"))}}
function saleModal(){if(!data.products.length){toast(t("noProducts"));productModal();return}openModal(`<h3>${t("newSale")}</h3><form id="saleForm"><div class="form-grid"><div class="field"><label>${t("customer")}</label><input name="customer"></div><div class="field"><label>${t("product")}</label><select name="productId" id="saleProduct">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — stock ${p.qty}</option>`).join("")}</select></div><div class="field"><label>${t("qty")} *</label><input name="qty" type="number" min=".01" step=".01" required></div><div class="field"><label>${t("unitPrice")}</label><input name="price" id="salePrice" type="number" min="0" step=".01"></div></div><div class="form-actions"><button type="button" class="btn secondary" data-close>${t("cancel")}</button><button class="btn">${t("createInvoice")}</button></div></form>`);const updatePrice=()=>{let p=data.products.find(x=>x.id===$("#saleProduct").value);$("#salePrice").value=p?.sellPrice||0};$("#saleProduct").onchange=updatePrice;updatePrice();$("#saleForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=data.products.find(x=>x.id===f.get("productId")),q=Number(f.get("qty")),price=Number(f.get("price"));if(!p||q<=0)return;if(q>p.qty){toast(t("notEnough"));return}p.qty-=q;let s={id:crypto.randomUUID(),invoice:"TG-"+Date.now().toString().slice(-8),date:new Date().toISOString(),customer:f.get("customer"),items:[{productId:p.id,name:p.name,qty:q,price}],total:q*price};data.sales.push(s);data.movements.push({id:crypto.randomUUID(),productId:p.id,productName:p.name,type:"out",qty:q,note:s.invoice,date:s.date});persist();closeModal();currentPage="sales";render();toast(t("successSale"))}}
function showInvoice(id){let s=data.sales.find(x=>x.id===id);if(!s)return;openModal(`<div id="invoicePrint"><h2>${esc(data.settings.appName||"Inventory Manager")}</h2><p>${t("invoice")}: <strong>${esc(s.invoice)}</strong><br>${t("date")}: ${esc(dateFmt(s.date))}<br>${t("customer")}: ${esc(s.customer||"—")}</p><table><thead><tr><th>${t("product")}</th><th>${t("qty")}</th><th>${t("unitPrice")}</th><th>${t("total")}</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join("")}</tbody></table><h3 style="text-align:right">${t("total")}: ${money(s.total)}</h3></div><div class="form-actions"><button class="btn secondary" data-close>${t("close")}</button><button class="btn" id="printInvoice">${t("print")}</button></div>`);$("#printInvoice").onclick=()=>{let w=window.open("","_blank");if(!w){toast("Allow pop-ups to print");return}w.document.write(`<html><head><title>${esc(s.invoice)}</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}</style></head><body>${$("#invoicePrint").innerHTML}</body></html>`);w.document.close();w.print()}}
function wirePage(){let b=(id,fn)=>{let el=$("#"+id);if(el)el.onclick=fn};b("dashAdd",()=>productModal());b("quickProduct",()=>productModal());b("addProductBtn",()=>productModal());b("quickIn",()=>moveModal("in"));b("quickOut",()=>moveModal("out"));b("addMoveBtn",()=>moveModal("in"));b("purchaseInBtn",()=>moveModal("in"));b("quickSale",saleModal);b("newSaleBtn",saleModal);document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>productModal(data.products.find(p=>p.id===el.dataset.edit)));document.querySelectorAll("[data-invoice]").forEach(el=>el.onclick=()=>showInvoice(el.dataset.invoice));document.querySelectorAll("[data-page]").forEach(el=>el.onclick=()=>{currentPage=el.dataset.page;render()});if($("#productSearch")){let filter=()=>{let q=$("#productSearch").value.toLowerCase(),cat=$("#catFilter").value;$("#productBody").innerHTML=productRows(data.products.filter(p=>(p.name+" "+p.code+" "+p.category).toLowerCase().includes(q)&&(!cat||p.category===cat)))};$("#productSearch").oninput=filter;$("#catFilter").onchange=filter}b("saveSettings",()=>{data.settings.appName=$("#appNameInput").value.trim()||"Inventory Manager";lang=$("#settingsLang").value;localStorage.setItem("tg_lang",lang);persist();render();toast(t("saveSettings"))});b("exportBtn",()=>{let a=document.createElement("a"),blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="thai-glass-inventory-backup.json";a.click();URL.revokeObjectURL(a.href)});b("importBtn",()=>$("#importFile").click());if($("#importFile"))$("#importFile").onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.products||!obj.movements||!obj.sales)throw 0;data=obj;persist();render();toast("Backup imported")}catch{toast("Invalid backup file")}}}
$("#langSelect").onchange=e=>{lang=e.target.value;localStorage.setItem("tg_lang",lang);render()};$("#settingsBtn").onclick=()=>{currentPage="settings";render()};
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script>
</body>
